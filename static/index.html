<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TapPad</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css?v11" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>TapPad</h1>
          <p id="status">Connecting</p>
        </div>
        <button id="reconnect" type="button" aria-label="Reconnect">↻</button>
      </header>

      <div class="tab-bar">
        <button class="tab-btn active" data-tab="main" type="button">Pad</button>
        <button class="tab-btn" data-tab="keys" type="button">Keys</button>
        <button class="tab-btn" data-tab="commands" type="button">Actions</button>
        <button class="tab-btn" data-tab="media" type="button">Media</button>
      </div>

      <div class="tab-panels">
        <div id="panel-main" class="tab-panel active">
          <section id="pad" class="pad" aria-label="Touchpad">
            <div class="pad-hint">
              <strong>TapPad</strong>
              <span>Tap · Hold · Scroll</span>
            </div>
          </section>
          <section class="bottom-bar">
            <div class="paste-row">
              <textarea id="textInput" rows="2" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type or dictate text"></textarea>
              <button id="sendText" type="button">Send</button>
            </div>
            <div class="primary-keys">
              <button data-key="MetaLeft" type="button">⌘</button>
              <button data-key="AltLeft" type="button">⌥</button>
              <button data-key="ControlLeft" type="button">Ctrl</button>
              <button data-key="ShiftLeft" type="button">⇧</button>
              <button data-key="Enter" type="button">Enter</button>
              <button data-key="Backspace" type="button">⌫</button>
            </div>
          </section>
        </div>
        <div id="panel-keys" class="tab-panel">
          <div class="panel-scroll">
            <div class="keys">
              <button data-key="Escape" type="button">Esc</button>
              <button data-key="Tab" type="button">Tab</button>
              <button data-key="Enter" type="button">Enter</button>
              <button data-key="Backspace" type="button">⌫</button>
              <button data-key="PrintScreen" type="button">PrtSc</button>
              <button data-key="MetaLeft" type="button">⌘</button>
              <button data-key="ControlLeft" type="button">Ctrl</button>
              <button data-key="ShiftLeft" type="button">Shift</button>
              <button data-key="AltLeft" type="button">⌥</button>
              <button data-key="Space" type="button">Space</button>
              <button data-key="ArrowUp" type="button">↑</button>
              <button data-key="ArrowLeft" type="button">←</button>
              <button data-key="ArrowDown" type="button">↓</button>
              <button data-key="ArrowRight" type="button">→</button>
              <button data-key="KeyA" type="button">A</button>
              <button data-key="KeyC" type="button">C</button>
              <button data-key="KeyV" type="button">V</button>
              <button data-key="KeyX" type="button">X</button>
              <button data-key="KeyZ" type="button">Z</button>
              <button data-key="KeyB" type="button">B</button>
              <button data-key="KeyS" type="button">S</button>
              <button data-key="KeyT" type="button">T</button>
              <button data-key="KeyW" type="button">W</button>
              <button data-key="KeyF" type="button">F</button>
              <button data-key="Digit1" type="button">1</button>
              <button data-key="Digit2" type="button">2</button>
              <button data-key="Digit3" type="button">3</button>
              <button data-key="Digit4" type="button">4</button>
              <button data-key="Digit5" type="button">5</button>
            </div>
            <button id="releaseAll" type="button" class="release-all">Release All Keys</button>
          </div>
        </div>
        <div id="panel-commands" class="tab-panel">
          <div class="panel-scroll">
            <div class="cmd-rec-row">
              <button data-cmd="screenrecord.screen" type="button" class="cmd-rec-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
                <span>Screen</span>
              </button>
              <button data-cmd="screenrecord.window" type="button" class="cmd-rec-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H4V4h16v16z"/></svg>
                <span>Window</span>
              </button>
              <button data-cmd="screenrecord.screen.audio" type="button" class="cmd-rec-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.92V21c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.57 5.42-2.92 5.91-5.92.1-.6-.39-1.14-1-1.14z"/></svg>
                <span>Audio</span>
              </button>
              <button data-cmd="screenrecord.screen.webcam" type="button" class="cmd-rec-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                <span>Cam</span>
              </button>
            </div>
            <div class="cmd-rec-row cmd-rec-controls">
              <button data-cmd="screenrecord.stop" type="button" class="cmd-stop-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
                <span>Stop</span>
              </button>
              <button data-cmd="open_recordings_folder" type="button" class="cmd-folder-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
                <span>Folder</span>
              </button>
            </div>
            <div class="keys">
              <button data-cmd="screenshot" type="button">Screenshot</button>
              <button data-cmd="close_window" type="button">Close Win</button>
              <button data-cmd="app_launcher" type="button">Launcher</button>
              <button data-cmd="nightlight.toggle" type="button">Night Light</button>
              <button data-cmd="lock_screen" type="button">Lock</button>
            </div>
          </div>
        </div>
        <div id="panel-media" class="tab-panel">
          <div class="panel-scroll">
            <div class="media-grid">
              <button data-cmd="media.prev" type="button" class="media-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>
              <button data-cmd="media.play_pause" type="button" class="media-btn media-btn-primary">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button data-cmd="media.next" type="button" class="media-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
              </button>
              <button data-cmd="media.volume_down" type="button" class="media-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
              </button>
              <button data-cmd="media.mute" type="button" class="media-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
              </button>
              <button data-cmd="media.volume_up" type="button" class="media-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="/app.js?v11"></script>
  </body>
</html>
