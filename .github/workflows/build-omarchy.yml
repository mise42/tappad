name: Build TapPad on Omarchy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-omarchy.yml"
      - "host/**"
      - "mobile/**"
      - "omarchy-plugin/**"
      - "packaging/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/build-omarchy.yml"
      - "host/**"
      - "mobile/**"
      - "omarchy-plugin/**"
      - "packaging/**"
      - "scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  omarchy:
    name: Test and package Omarchy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux input build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: host -> target

      - name: Check browser and Host contracts
        run: pnpm test

      - name: Test Omarchy Host
        run: cargo test --locked --manifest-path host/Cargo.toml

      - name: Build Omarchy Host
        if: github.ref == 'refs/heads/main'
        run: cargo build --release --locked --manifest-path host/Cargo.toml

      - name: Assemble Omarchy package
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          stage="release-stage/TapPad-Omarchy-x86_64"
          mkdir -p "$stage"
          install -m755 host/target/release/tappad-host "$stage/tappad-host"
          install -m755 packaging/install.sh "$stage/install.sh"
          install -m755 packaging/uninstall.sh "$stage/uninstall.sh"
          install -m644 packaging/systemd/tappad-host.service "$stage/tappad-host.service"
          cp -R omarchy-plugin "$stage/omarchy-plugin"
          cp -R mobile "$stage/mobile"
          cp LICENSE README.md "$stage/"
          tar -C release-stage -czf TapPad-Omarchy-x86_64.tar.gz TapPad-Omarchy-x86_64

      - name: Upload Omarchy package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: tappad-omarchy
          path: TapPad-Omarchy-x86_64.tar.gz
          if-no-files-found: error

  publish-main-prerelease:
    name: Publish Main Pre-release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [omarchy]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Download Omarchy package
        uses: actions/download-artifact@v8
        with:
          name: tappad-omarchy
          path: release-files

      - name: Publish GitHub pre-release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          short_sha="${GITHUB_SHA::7}"
          tag="main-${timestamp}-${short_sha}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" release-files/TapPad-Omarchy-x86_64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TapPad Omarchy ${timestamp} ${short_sha}" \
            --notes "Automated Omarchy build for commit $GITHUB_SHA." \
            --prerelease

      - name: Sync package to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TAPPAD_DOWNLOAD_BASE_URL: ${{ vars.TAPPAD_DOWNLOAD_BASE_URL }}
          TAPPAD_R2_BUCKET: ${{ vars.TAPPAD_R2_BUCKET }}
          TAPPAD_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] \
            || [ -z "${CLOUDFLARE_API_TOKEN:-}" ] \
            || [ -z "${TAPPAD_DOWNLOAD_BASE_URL:-}" ] \
            || [ -z "${TAPPAD_R2_BUCKET:-}" ]; then
            echo "Cloudflare R2 publishing is not configured; skipping."
            exit 0
          fi
          node scripts/build-download-manifest.mjs release-files release-files/downloads.json
          for file in release-files/*; do
            base_name="$(basename "$file")"
            pnpm dlx wrangler@latest r2 object put "$TAPPAD_R2_BUCKET/releases/$TAPPAD_RELEASE_TAG/$base_name" --file="$file" --remote
            pnpm dlx wrangler@latest r2 object put "$TAPPAD_R2_BUCKET/latest/$base_name" --file="$file" --remote
          done
