name: Build TapPad Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to sync to R2. Leave empty to build and publish a new pre-release."
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-desktop-host.yml"
      - "desktop/**"
      - "macos/**"
      - "mobile/**"
      - "package.json"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/build-desktop-host.yml"
      - "desktop/**"
      - "macos/**"
      - "mobile/**"
      - "package.json"
      - "scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Check shared scripts
        run: npm test

      - name: Install desktop tooling
        working-directory: desktop
        run: npm ci --prefer-offline --no-audit

      - name: Test desktop backend
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

  desktop-windows:
    name: Desktop Host Windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == ''))
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop tooling
        run: npm ci --prefer-offline --no-audit

      - name: Build Windows installer
        run: npm run build:locked

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tappad-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          compression-level: 0

  desktop-linux:
    name: Desktop Host Linux
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == ''))
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop tooling
        run: npm ci --prefer-offline --no-audit

      - name: Build Linux packages
        run: npm run build:locked

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tappad-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
          compression-level: 0

  desktop-macos:
    name: Tauri macOS Desktop Host
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == ''))
    runs-on: macos-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop tooling
        run: npm ci --prefer-offline --no-audit

      - name: Build Tauri macOS desktop host
        run: npm run build:locked

      - name: Upload Tauri macOS desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tappad-desktop-macos
          path: desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
          compression-level: 0

  macos-native:
    name: Native macOS
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == ''))
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build native macOS app
        working-directory: macos
        run: ./scripts/build_app.sh

      - name: Upload native macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tappad-native-macos
          path: macos/.dist/TapPad-mac.zip
          if-no-files-found: error
          compression-level: 0

  publish-main-prerelease:
    name: Publish Main Pre-release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == ''))
    runs-on: ubuntu-latest
    needs:
      - checks
      - desktop-windows
      - desktop-linux
      - desktop-macos
      - macos-native
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-files

          while IFS= read -r -d '' file; do
            artifact_name="$(printf '%s' "$file" | cut -d / -f 2)"
            base_name="$(basename "$file")"
            target="release-files/${base_name}"

            if [ -e "$target" ]; then
              target="release-files/${artifact_name}-${base_name}"
            fi

            cp "$file" "$target"
          done < <(
            find release-artifacts -type f \
              \( -name '*.AppImage' \
              -o -name '*.deb' \
              -o -name '*.dmg' \
              -o -name '*.exe' \
              -o -name '*.msi' \
              -o -name '*.rpm' \
              -o -name '*.zip' \) \
              -print0
          )

          test -n "$(find release-files -type f -print -quit)"
          find release-files -maxdepth 1 -type f -print | sort

      - name: Publish GitHub pre-release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          short_sha="${GITHUB_SHA::7}"
          tag="main-${timestamp}-${short_sha}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          cat > release-notes.md <<NOTES
          Automated TapPad main build.

          Commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          NOTES

          gh release create "$tag" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TapPad main ${timestamp} ${short_sha}" \
            --notes-file release-notes.md \
            --prerelease

      - name: Sync release files to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TAPPAD_DOWNLOAD_BASE_URL: ${{ vars.TAPPAD_DOWNLOAD_BASE_URL }}
          TAPPAD_R2_BUCKET: ${{ vars.TAPPAD_R2_BUCKET }}
          TAPPAD_RELEASE_TAG: ${{ steps.publish_release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] \
            || [ -z "${CLOUDFLARE_API_TOKEN:-}" ] \
            || [ -z "${TAPPAD_DOWNLOAD_BASE_URL:-}" ] \
            || [ -z "${TAPPAD_R2_BUCKET:-}" ]; then
            echo "Cloudflare R2 publishing is not configured; skipping."
            exit 0
          fi

          node scripts/build-download-manifest.mjs release-files release-files/downloads.json

          for file in release-files/*; do
            base_name="$(basename "$file")"
            npx --yes wrangler@latest r2 object put "$TAPPAD_R2_BUCKET/releases/$TAPPAD_RELEASE_TAG/$base_name" --file="$file"
            npx --yes wrangler@latest r2 object put "$TAPPAD_R2_BUCKET/latest/$base_name" --file="$file"
          done

  sync-existing-release-to-r2:
    name: Sync Existing Release to R2
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download GitHub release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAPPAD_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-files
          gh release download "$TAPPAD_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-files

          test -n "$(find release-files -type f -print -quit)"
          find release-files -maxdepth 1 -type f -print | sort

      - name: Sync release files to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TAPPAD_DOWNLOAD_BASE_URL: ${{ vars.TAPPAD_DOWNLOAD_BASE_URL }}
          TAPPAD_R2_BUCKET: ${{ vars.TAPPAD_R2_BUCKET }}
          TAPPAD_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] \
            || [ -z "${CLOUDFLARE_API_TOKEN:-}" ] \
            || [ -z "${TAPPAD_DOWNLOAD_BASE_URL:-}" ] \
            || [ -z "${TAPPAD_R2_BUCKET:-}" ]; then
            echo "Cloudflare R2 publishing is not configured."
            exit 1
          fi

          node scripts/build-download-manifest.mjs release-files release-files/downloads.json

          for file in release-files/*; do
            base_name="$(basename "$file")"
            npx --yes wrangler@latest r2 object put "$TAPPAD_R2_BUCKET/releases/$TAPPAD_RELEASE_TAG/$base_name" --file="$file"
            npx --yes wrangler@latest r2 object put "$TAPPAD_R2_BUCKET/latest/$base_name" --file="$file"
          done
