name: Build Desktop Host

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-desktop-host.yml"
      - "mobile/**"
      - "desktop/**"
  pull_request:
    paths:
      - ".github/workflows/build-desktop-host.yml"
      - "mobile/**"
      - "desktop/**"

jobs:
  build:
    name: Build Tauri installer
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend tooling
        run: npm ci

      - name: Build installer
        run: npm run build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tappad-desktop-host
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
