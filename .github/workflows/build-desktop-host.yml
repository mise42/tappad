name: Build TapPad Packages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-desktop-host.yml"
      - "desktop/**"
      - "macos/**"
      - "mobile/**"
      - "package.json"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/build-desktop-host.yml"
      - "desktop/**"
      - "macos/**"
      - "mobile/**"
      - "package.json"
      - "scripts/**"

jobs:
  checks:
    name: Checks
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Check shared scripts
        run: npm test

      - name: Install desktop tooling
        working-directory: desktop
        run: npm ci

      - name: Test desktop backend
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build native macOS package
        run: swift build --package-path macos

  desktop-windows:
    name: Desktop Host Windows
    runs-on: windows-latest
    needs: checks

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop tooling
        run: npm ci

      - name: Build Windows installer
        run: npm run build

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tappad-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  desktop-linux:
    name: Desktop Host Linux
    runs-on: ubuntu-latest
    needs: checks

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop tooling
        run: npm ci

      - name: Build Linux packages
        run: npm run build

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tappad-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error

  desktop-macos-comparison:
    name: Desktop Host macOS Comparison
    runs-on: macos-latest
    needs: checks

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop tooling
        run: npm ci

      - name: Build macOS comparison app
        run: npm run build

      - name: Upload macOS comparison desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tappad-desktop-macos-comparison
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.app
          if-no-files-found: error

  macos-native:
    name: Native macOS
    runs-on: macos-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native macOS app
        working-directory: macos
        run: ./scripts/build_app.sh

      - name: Upload native macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tappad-native-macos
          path: |
            macos/.dist/TapPad-mac-beta.zip
            macos/.dist/TapPad.app
          if-no-files-found: error
