name: Feature proposal
description: Propose an improvement grounded in a real use scenario
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: scenario
    attributes:
      label: Use scenario
      description: What are you trying to accomplish, and when would you reach for TapPad?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
      description: How do you handle this today?
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible result without prescribing an implementation.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundaries
      options:
        - label: This improves a concrete use scenario on current Omarchy.
          required: true
        - label: This keeps mobile input local to the user's network.
          required: true
        - label: This does not require arbitrary shell commands from the Mobile Input Surface.
          required: true
