<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TapPad Windows Host Surface</title>
    <style>
      :root {
        --bg: #f3efe7;
        --card: rgba(255, 255, 255, 0.84);
        --ink: #1e1f1f;
        --muted: #5f645f;
        --line: rgba(34, 39, 34, 0.12);
        --accent: #186046;
        --warn: #915b0a;
        --font: "Avenir Next", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(24, 96, 70, 0.18), transparent 30%),
          linear-gradient(160deg, #f5f1e9, #ece7dd 55%, #e7efe9);
      }

      main {
        width: min(1100px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      .hero {
        display: grid;
        gap: 16px;
        margin-bottom: 22px;
      }

      .eyebrow {
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 12px;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 54px);
        line-height: 0.95;
      }

      .subtitle {
        margin: 0;
        max-width: 720px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }

      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      }

      .card {
        background: var(--card);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 16px 40px rgba(46, 53, 46, 0.08);
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .card p,
      .card li,
      .card dd {
        color: var(--muted);
        line-height: 1.45;
      }

      dl {
        display: grid;
        gap: 10px;
        margin: 0;
      }

      dt {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      dd {
        margin: 4px 0 0;
        font-size: 14px;
        color: var(--ink);
        word-break: break-word;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      button,
      a.button {
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        font: inherit;
        cursor: pointer;
        text-decoration: none;
        color: white;
        background: var(--accent);
      }

      button.secondary,
      a.button.secondary {
        color: var(--ink);
        background: rgba(30, 31, 31, 0.08);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 13px;
        background: rgba(24, 96, 70, 0.1);
      }

      .readiness-group + .readiness-group {
        margin-top: 18px;
      }

      .readiness-group h3 {
        margin: 0 0 10px;
        font-size: 14px;
      }

      ul.list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      .status-line {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .status-badge {
        flex: none;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: rgba(24, 96, 70, 0.1);
        color: var(--accent);
      }

      .status-badge[data-state="degraded"],
      .status-badge[data-state="downgraded"],
      .status-badge[data-state="manual"] {
        background: rgba(145, 91, 10, 0.12);
        color: var(--warn);
      }

      .actions-grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }

      .action-card {
        border-radius: 18px;
        padding: 14px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.55);
      }

      .action-card strong {
        display: block;
        margin-bottom: 6px;
      }

      .notice {
        margin-top: 10px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="eyebrow">TapPad Beta</p>
        <h1>Windows host surface, not just a runtime shell.</h1>
        <p class="subtitle">
          Pair a phone, verify the local input server, inspect Windows readiness, and keep the
          current beta downgrades explicit instead of hiding them behind silent command failures.
        </p>
      </section>
      <section class="grid">
        <article class="card" id="pairingCard"></article>
        <article class="card" id="serverCard"></article>
        <article class="card" id="settingsCard"></article>
        <article class="card" id="readinessCard" style="grid-column: 1 / -1"></article>
        <article class="card" id="actionsCard" style="grid-column: 1 / -1"></article>
      </section>
    </main>
    <script>
      const invoke = window.__TAURI_INTERNALS__.invoke;

      function badge(state) {
        return `<span class="status-badge" data-state="${state}">${state}</span>`;
      }

      function statusLine(label, state, note) {
        const detail = note ? `<p class="notice">${note}</p>` : "";
        return `<li><div class="status-line"><strong>${label}</strong>${badge(state)}</div>${detail}</li>`;
      }

      async function copyText(value) {
        await navigator.clipboard.writeText(value);
      }

      function renderPairing(state) {
        const pairing = state.pairing;
        document.getElementById("pairingCard").innerHTML = `
          <h2>Pairing</h2>
          <p class="pill">Phone or tablet opens the preferred link below.</p>
          <dl>
            <div><dt>Preferred link</dt><dd>${pairing.preferredUrl}</dd></div>
            <div><dt>Fallback link</dt><dd>${pairing.localUrl}</dd></div>
            <div><dt>Pairing token</dt><dd>${pairing.token}</dd></div>
          </dl>
          <div class="actions">
            <button id="copyLink">Copy link</button>
            <a class="button secondary" href="${pairing.preferredUrl}" target="_blank" rel="noreferrer">Open local web UI</a>
          </div>
        `;
        document.getElementById("copyLink").addEventListener("click", () => copyText(pairing.preferredUrl));
      }

      function renderServer(state) {
        const server = state.serverStatus;
        document.getElementById("serverCard").innerHTML = `
          <h2>Server status</h2>
          <dl>
            <div><dt>Running on</dt><dd>${server.host}:${server.port}</dd></div>
            <div><dt>Bind address</dt><dd>${server.bindAddress}</dd></div>
            <div><dt>Token gate</dt><dd>${server.tokenEnabled ? "Enabled" : "Disabled"}</dd></div>
          </dl>
        `;
      }

      function renderSettings(state) {
        const settings = state.settings;
        document.getElementById("settingsCard").innerHTML = `
          <h2>Settings</h2>
          <dl>
            <div><dt>Port</dt><dd>${settings.port}</dd></div>
            <div><dt>Pairing token</dt><dd>${settings.tokenSummary}</dd></div>
            <div><dt>Launch at login</dt><dd>${settings.launchAtLogin.note}</dd></div>
          </dl>
          <div class="actions">
            <button class="secondary" id="resetToken">Reset pairing token</button>
          </div>
        `;
        document.getElementById("resetToken").addEventListener("click", async () => {
          const nextState = await invoke("reset_pairing_token");
          render(nextState);
        });
      }

      function renderReadiness(state) {
        document.getElementById("readinessCard").innerHTML = `
          <h2>Readiness</h2>
          ${state.readiness
            .map(
              (group) => `
                <section class="readiness-group">
                  <h3>${group.title}</h3>
                  <ul class="list">
                    ${group.items.map((item) => statusLine(item.label, item.state, item.note)).join("")}
                  </ul>
                </section>
              `,
            )
            .join("")}
        `;
      }

      function renderActions(state) {
        const visibleActions = Object.entries(state.actions).filter(([, value]) => value.state !== "hidden");
        document.getElementById("actionsCard").innerHTML = `
          <h2>Action parity</h2>
          <div class="actions-grid">
            ${visibleActions
              .map(
                ([name, value]) => `
                  <article class="action-card">
                    <strong>${name}</strong>
                    ${badge(value.state)}
                    ${value.note ? `<p class="notice">${value.note}</p>` : ""}
                  </article>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function render(state) {
        renderPairing(state);
        renderServer(state);
        renderSettings(state);
        renderReadiness(state);
        renderActions(state);
      }

      invoke("host_state").then(render).catch((error) => {
        document.body.innerHTML = `<main><section class="card"><h2>TapPad Windows backend</h2><p>${String(error)}</p></section></main>`;
      });
    </script>
  </body>
</html>
