<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TapPad Windows Backend</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      main {
        width: min(420px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        font-weight: 650;
      }

      p {
        margin: 0 0 10px;
        color: color-mix(in srgb, CanvasText 76%, transparent);
        line-height: 1.5;
      }

      code {
        padding: 2px 5px;
        border-radius: 4px;
        background: color-mix(in srgb, CanvasText 10%, transparent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TapPad Windows Backend</h1>
      <p>The local input server starts with this app.</p>
      <p>Open <code>http://&lt;this-pc-ip&gt;:8765</code> from your phone or tablet.</p>
      <p>Input is handled with Tauri, Rust, enigo, and arboard.</p>
    </main>
  </body>
</html>
