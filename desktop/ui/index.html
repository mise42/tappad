<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TapPad Desktop Host</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --panel: #ffffff;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --line: #d8d8dc;
        --soft-line: #ededf0;
        --accent: #0071e3;
        --accent-ink: #ffffff;
        --secondary: #ebebef;
        --warn: #9a6a00;
        --danger: #b3261e;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: var(--bg);
        font-family: var(--font);
      }

      main {
        width: min(460px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: 22px;
        font-weight: 650;
        line-height: 1.18;
      }

      h2 {
        margin-bottom: 14px;
        font-size: 15px;
        font-weight: 650;
      }

      h3 {
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 650;
      }

      p {
        color: var(--muted);
        line-height: 1.45;
      }

      .pairing-window {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        padding: 28px;
        text-align: center;
        box-shadow: 0 18px 45px rgb(0 0 0 / 8%);
      }

      .pairing-window > p {
        max-width: 430px;
        margin-right: auto;
        margin-left: auto;
        font-size: 13px;
      }

      dl,
      ul {
        margin: 0;
        padding: 0;
      }

      dl {
        display: grid;
        gap: 12px;
      }

      dt {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
      }

      dd {
        margin: 3px 0 0;
        word-break: break-word;
      }

      li {
        list-style: none;
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        padding: 0;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 16px;
      }

      button,
      a.button {
        border: 0;
        border-radius: 6px;
        padding: 7px 12px;
        font: inherit;
        font-size: 13px;
        color: var(--accent-ink);
        background: var(--accent);
        text-decoration: none;
        cursor: pointer;
      }

      button.secondary,
      a.secondary {
        color: var(--ink);
        background: var(--secondary);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .line {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid var(--soft-line);
      }

      .line:first-child {
        border-top: 0;
      }

      .badge {
        flex: none;
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 11px;
        color: #0d6b38;
        background: #e6f4ea;
        text-transform: uppercase;
      }

      .badge[data-state="deferred"],
      .badge[data-state="manual"],
      .badge[data-state="degraded"],
      .badge[data-state="downgraded"],
      .badge[data-state="disabled"] {
        color: var(--warn);
        background: #f4ebd6;
      }

      .badge[data-state="stopped"],
      .badge[data-state="error"] {
        color: var(--danger);
        background: #f5ded9;
      }

      .note {
        margin: 6px 0 0;
        font-size: 13px;
      }

      .qr-code {
        display: grid;
        place-items: center;
        width: 282px;
        height: 282px;
        margin: 20px auto 14px;
        border: 1px solid var(--soft-line);
        border-radius: 10px;
        background: #fff;
      }

      .qr-code img {
        width: 260px;
        height: 260px;
      }

      .qr-unavailable {
        max-width: 210px;
        color: var(--danger);
        font-size: 13px;
      }

      .pairing-link,
      .backup-link {
        margin: 0 auto;
        max-width: 100%;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .backup-link {
        margin-top: 8px;
        color: var(--muted);
      }

      .server-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 12px;
      }

      .server-pill::before {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #28a745;
        content: "";
      }

      .server-pill[data-running="false"]::before {
        background: var(--danger);
      }

      .advanced {
        margin-top: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgb(255 255 255 / 70%);
      }

      .advanced summary {
        padding: 13px 16px;
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }

      .advanced-content {
        display: grid;
        gap: 18px;
        padding: 0 16px 16px;
      }

      .advanced-section {
        min-width: 0;
        border-top: 1px solid var(--soft-line);
        padding-top: 16px;
      }

      .action-grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }

      .action-item {
        border: 1px solid var(--soft-line);
        border-radius: 8px;
        padding: 12px;
      }

      .action-item strong {
        display: block;
        margin-bottom: 8px;
      }

      #statusText {
        min-height: 18px;
        margin: 12px 0 0;
        font-size: 13px;
        text-align: center;
      }

      #statusText[data-kind="error"] {
        color: var(--danger);
      }

      @media (max-width: 720px) {
        main {
          padding: 16px 0;
        }

        .pairing-window {
          padding: 22px 18px;
        }

        .qr-code {
          width: min(282px, 100%);
        }

        .actions {
          flex-direction: column;
        }

        button,
        a.button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="pairing-window" id="pairing"></section>
      <details class="advanced">
        <summary>Advanced</summary>
        <div class="advanced-content">
          <section class="advanced-section" id="server"></section>
          <section class="advanced-section" id="settings"></section>
          <section class="advanced-section" id="readiness"></section>
          <section class="advanced-section" id="actions"></section>
        </div>
      </details>
      <p id="statusText" role="status"></p>
    </main>

    <script>
      const invoke = window.__TAURI__?.core?.invoke;
      let currentState = null;

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => {
          const entities = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          };
          return entities[char];
        });
      }

      function badge(state) {
        return `<span class="badge" data-state="${escapeHtml(state)}">${escapeHtml(state)}</span>`;
      }

      function line(label, state, note) {
        return `<li class="line"><div><strong>${escapeHtml(label)}</strong>${note ? `<p class="note">${escapeHtml(note)}</p>` : ""}</div>${badge(state)}</li>`;
      }

      function setStatus(message, kind = "note") {
        const status = document.getElementById("statusText");
        status.textContent = message;
        status.dataset.kind = kind;
      }

      async function copyText(value) {
        await navigator.clipboard.writeText(value);
        setStatus("Copied");
      }

      function renderPairing(state) {
        const pairing = state.pairing;
        const server = state.serverStatus;
        const qr = pairing.qrCodeDataUrl
          ? `<img alt="Pairing QR code" src="${escapeHtml(pairing.qrCodeDataUrl)}" />`
          : `<p class="qr-unavailable">Pairing code unavailable. Copy the link below instead.</p>`;
        const backup =
          pairing.localUrl && pairing.localUrl !== pairing.preferredUrl
            ? `<p class="backup-link">Backup: ${escapeHtml(pairing.localUrl)}</p>`
            : "";
        document.getElementById("pairing").innerHTML = `
          <h1>Scan to control this computer</h1>
          <p>Open TapPad from a phone, tablet, or browser on the same local network.</p>
          <div class="qr-code">${qr}</div>
          <p class="pairing-link">${escapeHtml(pairing.preferredUrl)}</p>
          ${backup}
          <div class="actions">
            <button id="copyLink" type="button">Copy Link</button>
            <a class="button secondary" href="${escapeHtml(pairing.preferredUrl)}" target="_blank" rel="noreferrer">Open Locally</a>
          </div>
          <div class="server-pill" data-running="${server.running}">Server ${server.running ? "running" : "stopped"} on ${escapeHtml(server.host)}:${escapeHtml(server.port)}</div>
        `;
        document.getElementById("copyLink").addEventListener("click", () => copyText(pairing.preferredUrl));
      }

      function renderServer(state) {
        const server = state.serverStatus;
        document.getElementById("server").innerHTML = `
          <h2>Server Status</h2>
          <dl>
            <div><dt>Running</dt><dd>${server.running ? "Yes" : "No"}</dd></div>
            <div><dt>Address</dt><dd>${escapeHtml(server.host)}:${escapeHtml(server.port)}</dd></div>
            <div><dt>Bind address</dt><dd>${escapeHtml(server.bindAddress)}</dd></div>
            <div><dt>Token gate</dt><dd>${server.tokenEnabled ? "Enabled" : "Disabled"}</dd></div>
          </dl>
        `;
      }

      function renderSettings(state) {
        const settings = state.settings;
        document.getElementById("settings").innerHTML = `
          <h2>Settings</h2>
          <form id="settingsForm">
            <dl>
              <div>
                <dt>Port</dt>
                <dd><input id="settingsPort" inputmode="numeric" value="${escapeHtml(settings.port)}" /></dd>
              </div>
              <div>
                <dt>Pairing token</dt>
                <dd><input id="settingsToken" value="${escapeHtml(state.pairing.token || "")}" required /></dd>
              </div>
              <div>
                <dt>Launch at login</dt>
                <dd><label><input id="settingsLaunch" type="checkbox" ${settings.launchAtLogin.state === "enabled" ? "checked" : ""} /> Start TapPad with this desktop session</label></dd>
              </div>
            </dl>
            <div class="actions">
              <button type="submit">Save</button>
              <button class="secondary" type="button" id="resetToken">Reset Token</button>
            </div>
            <p class="note">${escapeHtml(settings.launchAtLogin.note || "")}</p>
          </form>
        `;

        document.getElementById("settingsForm").addEventListener("submit", async (event) => {
          event.preventDefault();
          const port = Number.parseInt(document.getElementById("settingsPort").value, 10);
          const token = document.getElementById("settingsToken").value.trim();
          const launchAtLogin = document.getElementById("settingsLaunch").checked;
          await saveSettings({ port, token, launchAtLogin });
        });

        document.getElementById("resetToken").addEventListener("click", resetToken);
      }

      function renderReadiness(state) {
        document.getElementById("readiness").innerHTML = `
          <h2>Readiness</h2>
          ${state.readiness
            .map(
              (group) => `
                <section>
                  <h3>${group.title}</h3>
                  <ul>${group.items.map((item) => line(item.label, item.state, item.note)).join("")}</ul>
                </section>
              `,
            )
            .join("")}
        `;
      }

      function renderActions(state) {
        const visibleActions = Object.entries(state.actions).filter(([, value]) => value.state !== "hidden");
        document.getElementById("actions").innerHTML = `
          <h2>Desktop Actions</h2>
          <div class="action-grid">
            ${visibleActions
              .map(
                ([name, value]) => `
                  <article class="action-item">
                    <strong>${escapeHtml(name)}</strong>
                    ${badge(value.state)}
                    ${value.note ? `<p class="note">${escapeHtml(value.note)}</p>` : ""}
                  </article>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function render(state) {
        currentState = state;
        renderPairing(state);
        renderServer(state);
        renderSettings(state);
        renderReadiness(state);
        renderActions(state);
      }

      async function refresh() {
        if (!invoke) {
          throw new Error("Tauri invoke API is unavailable.");
        }
        render(await invoke("host_state"));
      }

      async function saveSettings(settings) {
        try {
          setStatus("Saving...");
          render(await invoke("save_settings", settings));
          setStatus("Saved and restarted");
        } catch (error) {
          setStatus(String(error), "error");
          render(currentState);
        }
      }

      async function resetToken() {
        try {
          setStatus("Resetting...");
          render(await invoke("reset_pairing_token"));
          setStatus("Token reset and backend restarted");
        } catch (error) {
          setStatus(String(error), "error");
        }
      }

      refresh().catch((error) => {
        document.querySelector("main").innerHTML = `
          <section class="pairing-window">
            <h2>TapPad Desktop Host unavailable</h2>
            <p>${escapeHtml(String(error))}</p>
          </section>
        `;
      });
    </script>
  </body>
</html>
