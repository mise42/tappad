plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tappadpinnedsocket'
version = '0.1.0'

android {
  namespace "expo.modules.tappadpinnedsocket"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Same OkHttp that React Native ships; Gradle resolves both to one version.
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}
